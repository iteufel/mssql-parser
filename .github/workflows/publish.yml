name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First publish: sign in to npm via the browser link in the job log, then configure trusted publishing"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global npm@11.21.1
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bun -e 'const {version}=await Bun.file("package.json").json(); if(process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match package version");'
      # npm requires the package to exist before an OIDC trust can be configured.
      # This one-time interactive web login runs on the runner; no npm token secret.
      - name: Sign in to npm for the first publish
        id: npm_login
        if: inputs.bootstrap
        timeout-minutes: 17
        run: |
          for attempt in 1 2 3; do
            echo "::notice::npm sign-in attempt ${attempt}/3. Open the newest login link below and complete approval before it expires."
            if npm login --auth-type=web --no-browser </dev/null; then
              exit 0
            fi
          done
          echo "::error::npm sign-in did not complete after three attempts. Re-run the workflow to get a new login link."
          exit 1
      - name: Publish package
        timeout-minutes: 15
        # npm only waits for browser 2FA when both streams are terminals.
        # Normal OIDC releases do not prompt; bootstrap login does.
        run: script -q -e -c 'npm publish --access public --provenance --no-browser' /dev/null
      - name: Configure trusted publishing for future releases
        if: inputs.bootstrap
        timeout-minutes: 10
        run: script -q -e -c 'npm trust github mssql-parser --repo iteufel/mssql-parser --file publish.yml --allow-publish --yes --no-browser' /dev/null
      - name: Remove bootstrap login
        if: always() && inputs.bootstrap && steps.npm_login.outcome == 'success'
        run: npm logout --registry=https://registry.npmjs.org
